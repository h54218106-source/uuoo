<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><title>WormGPT</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{height:58px;border-bottom:1px solid #262626;display:flex;align-items:center;padding:0 16px;gap:10px;background:#111}.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#dc2626,#7f1d1d);display:grid;place-items:center;font-weight:800}.title{font-weight:700}.wrap{max-width:900px;margin:auto;height:calc(100vh - 58px);display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:28px 18px}.welcome{text-align:center;margin-top:18vh}.welcome h1{font-size:32px;margin:0 0 10px}.welcome p{color:#999}.bubble{max-width:760px;margin:12px auto;padding:14px 16px;border-radius:14px;white-space:pre-wrap}.user{background:#1d1d1d}.ai{background:#121212;border:1px solid #222}.composer{padding:14px 18px 20px}.bar{display:flex;gap:8px;background:#151515;border:1px solid #333;border-radius:14px;padding:8px}.bar input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:10px;font-size:15px}.bar button{border:0;border-radius:10px;background:#dc2626;color:white;padding:0 18px;font-weight:700}.note{text-align:center;color:#666;font-size:11px;margin-top:8px}</style></head><body><header><div class="logo">W</div><div class="title">WormGPT</div></header><main class="wrap"><section id="messages" class="messages"><div id="welcome" class="welcome"><h1>WormGPT</h1><p>Your web app is online. Send a message below.</p></div></section><div class="composer"><div class="bar"><input id="input" placeholder="Message WormGPT..." autocomplete="off"><button id="send">Send</button></div><div class="note">Static Netlify build • local Ollama/backend is not included</div></div></main><script>const i=document.getElementById('input'),b=document.getElementById('send'),m=document.getElementById('messages'),w=document.getElementById('welcome');function send(){const t=i.value.trim();if(!t)return;if(w)w.remove();const u=document.createElement('div');u.className='bubble user';u.textContent=t;m.appendChild(u);const a=document.createElement('div');a.className='bubble ai';a.textContent='This static deployment is working. Connect an AI API/backend to generate real responses.';m.appendChild(a);i.value='';m.scrollTop=m.scrollHeight}b.onclick=send;i.addEventListener('keydown',e=>{if(e.key==='Enter')send()});</script></body></html>
